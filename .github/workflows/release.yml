name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require access public key
        shell: pwsh
        run: if (-not (Test-Path access/public.pem)) { throw 'Missing access/public.pem. Run node tools/keygen.js and commit access/public.pem.' }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      - name: Check build output
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          ls dist/*.exe
          cat dist/latest.yml
      - name: Create release and upload files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/*.exe.blockmap dist/latest.yml --title "${{ github.ref_name }}" --generate-notes