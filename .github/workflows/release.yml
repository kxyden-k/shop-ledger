name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require access public key
        shell: pwsh
        run: if (-not (Test-Path access/public.pem)) { throw 'Missing access/public.pem. Run node tools/keygen.js and commit access/public.pem.' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish always
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
