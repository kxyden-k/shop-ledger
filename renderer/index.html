<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Ledger</title>
<link rel="stylesheet" href="styles.css">
<!-- Where component screens find their libraries: copies in renderer/vendor (see tools/vendor.js). -->
<script type="importmap">{ "imports": { "preact": "./vendor/preact.mjs", "preact/hooks": "./vendor/hooks.mjs", "htm": "./vendor/htm.mjs" } }</script>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="brand-name">Shop Ledger</div><div class="brand-sub"><span id="biz-name"></span> <span id="ver"></span></div></div>
<nav id="nav" aria-label="Main"></nav>
</aside>
<main><div id="top"></div><div id="app"></div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="busy-bar" class="busy-bar" role="progressbar" aria-label="Working…" hidden></div>
<!-- Plain scripts sharing one global scope, loaded in this order (later files use earlier ones).
     ledger.js, insights.js, reports.js and documents.js are the business logic, state.js holds the data,
     each screens/ file draws one tab. -->
<script src="js/ledger.js"></script>
<script src="js/insights.js"></script>
<script src="js/reports.js"></script>
<script src="js/documents.js"></script>
<script src="js/html.js"></script>
<script src="js/state.js"></script>
<script src="js/screens/send.js"></script>
<script src="js/screens/dashboard.js"></script>
<script src="js/screens/products.js"></script>
<script src="js/screens/orders.js"></script>
<script src="js/screens/customers.js"></script>
<script src="js/screens/purchasing.js"></script>
<script src="js/screens/expenses.js"></script>
<script src="js/screens/reports.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/licences.js"></script>
<script src="js/app.js"></script>
<!-- Component screens (Preact). Modules run after the scripts above and before the first render. -->
<script type="module" src="js/screens/insights.mjs"></script>
</body>
</html>
